[package]
name = "grafida-shell"
version = "0.4.1"
edition = "2024"
license = "MIT"
description = "A native PHP desktop application shell: window, webview, custom scheme, PHP worker supervisor."
repository = "https://github.com/grafida/shell"
publish = false

[dependencies]
getrandom = "0.4.3"
jsonschema = { version = "0.61.0", default-features = false }
libc = "0.2.191"
pollster = "0.4"
raw-window-handle = "0.6"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tao = "0.37.2"
url = "2.5.8"

[workspace]
# The launcher is its own crate so that it links nothing but std: it is built static (musl) and
# must run where GTK, WebKitGTK or a new enough glibc are missing (grafida/grafida#86).
members = ["launcher"]

[dev-dependencies]
base64 = "0.22"
sha2 = "0.10"

[features]
# The debug-only automation channel (src/automation.rs). Never in a release build.
automation = ["dep:cairo-rs", "dep:javascriptcore-rs"]

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = { version = "0.6.5", features = ["exception"] }
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-web-kit = "0.3.2"

[target.'cfg(windows)'.dependencies]
# The shell owns WebView2 through webview2-com, without wry (ADR 0001, grafida/grafida#91).
webview2-com = "0.39.1"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18", features = ["png"], optional = true }
javascriptcore-rs = { version = "1.1.2", optional = true }
gtk = "0.18"
soup3 = "0.5"
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
# KWin's per-window decoration colours (src/linux/decoration.rs): the wl_display and wl_surface
# come from GDK, and the backend must be libwayland's own to share them (rfd links it already).
gdkwayland-sys = "0.18"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
