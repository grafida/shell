[package]
name = "grafida-shell"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small, app-agnostic native desktop shell: window, webview, custom scheme, PHP worker supervisor."
repository = "https://github.com/grafida/shell"
publish = false

[dependencies]
jsonschema = { version = "0.61.0", default-features = false }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[workspace]
exclude = ["spikes"]

[dev-dependencies]
base64 = "0.22"
sha2 = "0.10"
