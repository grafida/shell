[package]
name = "spike-macos"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase 4 spike (grafida/grafida#88): the shell owns WKWebView + WKURLSchemeHandler through objc2."

# Not part of the shell's workspace (the root excludes spikes/).
[workspace]

[dependencies]
block2 = "0.6.2"
hex = "0.4"
objc2 = { version = "0.6.5", features = ["exception"] }
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-web-kit = "0.3.2"
pollster = "0.4"
rfd = "0.18.0"
serde_json = "1"
sha2 = "0.10"
tao = "0.37.2"

[profile.release]
debug = false
