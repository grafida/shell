# Linux release binaries (grafida/grafida#86).
#
# Every push builds what a release would ship, on the oldest Ubuntu we promise (22.04, glibc 2.35;
# ADR 0001), for x86_64 and aarch64, checks it (scripts/release/check-linux-binaries.sh) and runs it
# headless (scripts/release/smoke-linux.sh). A tag X.Y.Z equal to the crates' version also
# publishes the release: grafida-shell-linux-{x86_64,aarch64} (the shell) and
# grafida-launcher-linux-{x86_64,aarch64} (the static launcher), each with a .sha256. A tag's
# release is written once and never again; consumers pin the tag and the hashes.
#
# Release binaries never carry the automation channel: `--features automation` is not passed here,
# a release build with it is a compile_error!, and the check script looks for it in the artefact.
name: Release

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    env:
      MUSL: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl

      - name: Build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb dbus
          echo "webkit2gtk-4.1 $(pkg-config --modversion webkit2gtk-4.1)"
          ldd --version | head -1

      - name: The tag is the crates' version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for toml in Cargo.toml launcher/Cargo.toml; do
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$toml" | head -1)"
            [ "$version" = "$GITHUB_REF_NAME" ] || { echo "$toml says $version, the tag is $GITHUB_REF_NAME"; exit 1; }
          done

      - name: Build (release profile, no automation)
        run: |
          cargo build --release --locked -p grafida-shell
          cargo build --release --locked -p grafida-launcher --target "$MUSL"

      - name: Check the binaries
        run: scripts/release/check-linux-binaries.sh target/release/grafida-shell "target/$MUSL/release/grafida-launcher"

      - name: Smoke test (headless, through the launcher)
        run: scripts/release/smoke-linux.sh target/release/grafida-shell "target/$MUSL/release/grafida-launcher"

      - name: Name the assets
        run: |
          mkdir -p out
          cp target/release/grafida-shell "out/grafida-shell-linux-${{ matrix.arch }}"
          cp "target/$MUSL/release/grafida-launcher" "out/grafida-launcher-linux-${{ matrix.arch }}"
          cd out && for f in grafida-*; do sha256sum "$f" > "$f.sha256"; done && cat ./*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*

      # The verification build for packaged apps on clean machines (scripts/dev/parity-linux.sh with
      # SHELL_BIN + GRAFIDA_PACKAGED): a DEBUG build with the automation channel, built here because
      # one built on a newer distribution would not load on 22.04. A workflow artifact only, never a
      # release asset (the publish job downloads linux-* alone).
      - name: Build the debug automation shell (for verification only)
        run: cargo build --locked -p grafida-shell --features automation

      - uses: actions/upload-artifact@v4
        with:
          name: debug-automation-linux-${{ matrix.arch }}
          path: target/debug/grafida-shell
          retention-days: 30

  publish:
    needs: [linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: assets
          merge-multiple: true

      # A draft until every asset is up, so a half-uploaded release is never visible. An existing
      # release for the tag makes this fail: a published release is never rewritten.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --draft --verify-tag \
            --title "Grafida Shell $GITHUB_REF_NAME" \
            --notes "Linux binaries of the Grafida Shell $GITHUB_REF_NAME (commit $GITHUB_SHA), built on Ubuntu 22.04 (glibc 2.35, WebKitGTK 4.1). See CHANGELOG.md. Pin the tag and the .sha256 of each asset."
          gh release edit "$GITHUB_REF_NAME" --draft=false
