# Release binaries: Linux (grafida/grafida#86), macOS (grafida/grafida#88) and Windows (#91).
#
# Every push builds what a release would ship, checks it and runs it:
#   Linux: on the oldest Ubuntu we promise (22.04, glibc 2.35; ADR 0001), x86_64 and aarch64,
#          checked by scripts/release/check-linux-binaries.sh, run headless by smoke-linux.sh;
#   macOS: arm64 only, linked for macOS 12.0 (the floor), checked by check-macos-binaries.sh
#          (minos from LC_BUILD_VERSION, system libraries only), run by smoke-macos.sh in a
#          bundle layout;
#   Windows: x86_64, MSVC with a static CRT and the WebView2 loader linked in, checked by
#          check-windows-binaries.sh (GUI subsystem, system DLLs only, the manifest), run by
#          smoke-windows.sh in the packaged layout.
# A tag X.Y.Z equal to the crates' version also publishes the release:
# grafida-shell-linux-{x86_64,aarch64}, grafida-launcher-linux-{x86_64,aarch64} (the static
# launcher), grafida-shell-macos-arm64 and grafida-shell-windows-x86_64.exe, each with a .sha256. A tag's release is written once
# and never again; consumers pin the tag and the hashes.
#
# Release binaries never carry the automation channel: `--features automation` is not passed here,
# a release build with it is a compile_error!, and the check script looks for it in the artefact.
name: Release

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    env:
      MUSL: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl

      - name: Build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb dbus
          echo "webkit2gtk-4.1 $(pkg-config --modversion webkit2gtk-4.1)"
          ldd --version | head -1

      - name: The tag is the crates' version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for toml in Cargo.toml launcher/Cargo.toml; do
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$toml" | head -1)"
            [ "$version" = "$GITHUB_REF_NAME" ] || { echo "$toml says $version, the tag is $GITHUB_REF_NAME"; exit 1; }
          done

      - name: Build (release profile, no automation)
        run: |
          cargo build --release --locked -p grafida-shell
          cargo build --release --locked -p grafida-launcher --target "$MUSL"

      - name: Check the binaries
        run: scripts/release/check-linux-binaries.sh target/release/grafida-shell "target/$MUSL/release/grafida-launcher"

      - name: Smoke test (headless, through the launcher)
        run: scripts/release/smoke-linux.sh target/release/grafida-shell "target/$MUSL/release/grafida-launcher"

      - name: Name the assets
        run: |
          mkdir -p out
          cp target/release/grafida-shell "out/grafida-shell-linux-${{ matrix.arch }}"
          cp "target/$MUSL/release/grafida-launcher" "out/grafida-launcher-linux-${{ matrix.arch }}"
          cd out && for f in grafida-*; do sha256sum "$f" > "$f.sha256"; done && cat ./*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*

      # The verification build for packaged apps on clean machines (scripts/dev/parity-linux.sh with
      # SHELL_BIN + GRAFIDA_PACKAGED): a DEBUG build with the automation channel, built here because
      # one built on a newer distribution would not load on 22.04. A workflow artifact only, never a
      # release asset (the publish job downloads linux-* alone).
      - name: Build the debug automation shell (for verification only)
        run: cargo build --locked -p grafida-shell --features automation

      - uses: actions/upload-artifact@v4
        with:
          name: debug-automation-linux-${{ matrix.arch }}
          path: target/debug/grafida-shell
          retention-days: 30

  macos:
    name: macOS arm64
    runs-on: macos-15
    env:
      # The floor (ADR 0001). .cargo/config.toml says the same; the check reads it from the binary.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: The tag is the crates' version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for toml in Cargo.toml launcher/Cargo.toml; do
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$toml" | head -1)"
            [ "$version" = "$GITHUB_REF_NAME" ] || { echo "$toml says $version, the tag is $GITHUB_REF_NAME"; exit 1; }
          done

      - name: Build (release profile, no automation)
        run: cargo build --release --locked -p grafida-shell

      - name: Check the binary
        run: scripts/release/check-macos-binaries.sh target/release/grafida-shell

      - name: Smoke test (a bundle layout, the fake worker's page mode)
        run: scripts/release/smoke-macos.sh target/release/grafida-shell

      - name: Name the asset
        run: |
          mkdir -p out
          cp target/release/grafida-shell out/grafida-shell-macos-arm64
          cd out && shasum -a 256 grafida-shell-macos-arm64 > grafida-shell-macos-arm64.sha256 && cat ./*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: out/*

      # The verification build for packaged apps on the clean macOS guests (parity-macos.sh with
      # SHELL_BIN + GRAFIDA_PACKAGED, swapped into a copy of the bundle): a DEBUG build with the
      # automation channel, linked for macOS 12 like the release. A workflow artifact only, never a
      # release asset (the publish job downloads linux-* and macos-* alone).
      - name: Build the debug automation shell (for verification only)
        run: |
          cargo build --locked -p grafida-shell --features automation
          minos="$(otool -l target/debug/grafida-shell | awk '$1 == "cmd" { cmd = $2 } cmd == "LC_BUILD_VERSION" && $1 == "minos" { print $2; exit }')"
          echo "debug build minos: $minos"
          test "$minos" = "12.0"

      - uses: actions/upload-artifact@v4
        with:
          name: debug-automation-macos-arm64
          path: target/debug/grafida-shell
          retention-days: 30

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    defaults:
      run:
        shell: bash   # Git Bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag is the crates' version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for toml in Cargo.toml launcher/Cargo.toml; do
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$toml" | head -1)"
            [ "$version" = "$GITHUB_REF_NAME" ] || { echo "$toml says $version, the tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - name: Build (release profile, no automation)
        run: cargo build --release --locked -p grafida-shell
      - name: Check the binary
        run: scripts/release/check-windows-binaries.sh target/release/grafida-shell.exe
      - name: Smoke test (the packaged layout, the fake worker's page mode)
        run: scripts/release/smoke-windows.sh target/release/grafida-shell.exe
      - name: Name the asset
        run: |
          mkdir -p out
          cp target/release/grafida-shell.exe out/grafida-shell-windows-x86_64.exe
          cd out && sha256sum grafida-shell-windows-x86_64.exe > grafida-shell-windows-x86_64.exe.sha256 && cat ./*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: out/*
      # The verification build for packaged apps in the Windows guests (parity-windows.sh with
      # SHELL_BIN + GRAFIDA_PACKAGED, swapped into a copy of the installed app): a DEBUG build with
      # the automation channel. A workflow artifact only, never a release asset.
      - name: Build the debug automation shell (for verification only)
        run: cargo build --locked -p grafida-shell --features automation
      - uses: actions/upload-artifact@v4
        with:
          name: debug-automation-windows-x86_64
          path: target/debug/grafida-shell.exe
          retention-days: 30

  publish:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: assets
          merge-multiple: true

      # A draft until every asset is up, so a half-uploaded release is never visible. An existing
      # release for the tag makes this fail: a published release is never rewritten.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --draft --verify-tag \
            --title "Grafida Shell $GITHUB_REF_NAME" \
            --notes "Binaries of the Grafida Shell $GITHUB_REF_NAME (commit $GITHUB_SHA). Linux x86_64 and aarch64: built on Ubuntu 22.04 (glibc 2.35, WebKitGTK 4.1), with the static launcher. macOS arm64: linked for macOS 12.0, ad-hoc signed by the linker only (an app signs it inside its bundle). Windows x86_64: Windows 10 22H2 or later with the WebView2 Evergreen runtime, a static CRT, unsigned (an app signs it with its installer). See CHANGELOG.md. Pin the tag and the .sha256 of each asset."
          gh release edit "$GITHUB_REF_NAME" --draft=false
