name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup component add rustfmt clippy
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
          echo "webkit2gtk-4.1 $(pkg-config --modversion webkit2gtk-4.1)"
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features automation -- -D warnings
      # A release build must refuse the automation feature outright.
      - name: Automation never compiles into a release build
        run: "! cargo check --release --features automation 2>/dev/null"
      - run: cargo test --workspace
      # The fixture writer only adds cases; anything it would add must already be committed.
      - name: Fixtures are complete and untouched
        run: |
          python3 -I scripts/protocol/make-fixtures.py
          git status --porcelain protocol/fixtures
          test -z "$(git status --porcelain protocol/fixtures)"

  shell-macos:
    name: Shell (macOS)
    runs-on: macos-15
    env:
      # The floor (ADR 0001); .cargo/config.toml sets the same, this makes it explicit.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup component add rustfmt clippy
          # Intel Macs (grafida/grafida#92): linted and guarded here, cross-compiled from arm64.
          rustup target add x86_64-apple-darwin
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features automation -- -D warnings
      - name: Automation never compiles into a release build
        run: "! cargo check --release --features automation 2>/dev/null"
      - run: cargo test --workspace
      - name: Linked for macOS 12 (LC_BUILD_VERSION minos)
        run: |
          cargo build --locked
          minos=$(otool -l target/debug/grafida-shell | awk '/LC_BUILD_VERSION/ { seen = 1 } seen && $1 == "minos" { print $2; exit }')
          echo "minos: $minos"
          test "$minos" = "12.0"
      # x86_64: the same gate, cross-compiled (the tests run on arm64 only; the release workflow
      # smoke-tests the x86_64 binary on an Intel runner).
      - run: cargo clippy --workspace --all-targets --target x86_64-apple-darwin -- -D warnings
      - run: cargo clippy --workspace --all-targets --target x86_64-apple-darwin --features automation -- -D warnings
      - name: Automation never compiles into a release build (x86_64)
        run: "! cargo check --release --target x86_64-apple-darwin --features automation 2>/dev/null"
      - name: Linked for macOS 12 (x86_64)
        run: |
          cargo build --locked --target x86_64-apple-darwin
          bin=target/x86_64-apple-darwin/debug/grafida-shell
          minos=$(otool -l "$bin" | awk '/LC_BUILD_VERSION/ { seen = 1 } seen && $1 == "minos" { print $2; exit }')
          echo "$(lipo -archs "$bin"), minos: $minos"
          test "$(lipo -archs "$bin")" = x86_64
          test "$minos" = "12.0"

  shell-windows:
    name: Shell (Windows)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash   # Git Bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features automation -- -D warnings
      - name: Automation never compiles into a release build
        run: "! cargo check --release --features automation 2>/dev/null"
      # The fake worker is Python; the runner's interpreter is `python` (grafida/grafida#91).
      - run: cargo test --workspace
        env:
          SHELL_TEST_PYTHON: python
