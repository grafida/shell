name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell (skeleton)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Phase 0 evidence for the deployment floors (ADR 0001): the wry spike must build on the
  # oldest Linux we promise (Ubuntu 22.04 / glibc 2.35, webkit2gtk-4.1 >= 2.40), on macOS
  # and on Windows.
  spike-wry:
    name: Spike (wry) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
          echo "webkit2gtk-4.1 $(pkg-config --modversion webkit2gtk-4.1)"
          ldd --version | head -1
      - name: Build
        working-directory: spikes/rust-wry
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo build --release --locked
